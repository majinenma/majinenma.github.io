<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Low Card Showdown has moved</title>
<style>
html,body{margin:0;height:100%}
body{display:flex;align-items:center;justify-content:center;background:#1b0b34;color:#f3ecff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
main{max-width:420px}
h1{font-size:1.6rem;margin:0 0 12px}
p{line-height:1.5;color:#cbbde6;margin:0 0 22px}
a.btn{display:inline-block;padding:14px 26px;border-radius:999px;background:linear-gradient(180deg,#ffbf47,#ff8a1f);color:#2a1200;font-weight:800;text-decoration:none;font-size:1.05rem}
small{display:block;margin-top:26px}
small a{color:#a99bc4}
</style>
</head>
<body>
<main>
<h1>Low Card Showdown has moved</h1>
<p>The game is now played at a new address. Tap the button to keep playing.</p>
<a class="btn" href="https://lowcardshowdown-test.low-card-showdown-server.workers.dev/">Play Low Card Showdown</a>
<small><a href="privacy.html">Privacy policy</a></small>
</main>
<script>
// Phones that saved the old game: delete the saved copy so it no longer opens here.
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () {});
if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }).catch(function () {});
</script>
</body>
</html>
